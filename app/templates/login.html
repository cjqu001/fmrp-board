{% extends "base.html" %}
{% block title %}Log in · FMRP{% endblock %}
{% block content %}
<h1>Log in to edit</h1>
{% if error %}<p class="flash error">{{ error }}</p>{% endif %}
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Your name <small>(shown in the change log)</small>
    <input name="name" maxlength="60" autocomplete="name">
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit" class="primary">Log in</button>
</form>
{% endblock %}
